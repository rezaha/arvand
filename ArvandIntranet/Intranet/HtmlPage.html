<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title></title>


        <script src="Scripts/jquery.js"></script>
        <script src="Scripts/jquery.poshytip.min.js"></script>
        <link href="SystemMng/css/tip-twitter.css" rel="stylesheet" />
        
        <script type="text/javascript">
            $(function () {
                $('.tooltip').poshytip({
                    className: 'tip-twitter',
                    showTimeout: 500,
                    alignTo: 'target',
                    alignX: 'center',
                    offsetY: 5,
                    allowTipHover: false,
                    fade: false,
                    slide: false
                });
            })
        </script>
    </head>
<body>
    <a class="tooltip" title="این قسمت برای چیدمان صفحه اصلی سایت استفاده میشود." href="#">
        <span>
            طراحی صفحه اصلی
        </span>
    </a>
</body>
</html>
